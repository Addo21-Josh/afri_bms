name: Afri_BMS Release Build Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom Build Number (optional, defaults to run number)'
        required: false
        default: ''

jobs:
  build_release:
    name: Build Signed Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=release.keystore
          EOF
            echo "Release key.properties configured successfully."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided. Using debug signing fallback."
          fi

      - name: Determine Build Number
        id: build_info
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Build Android App Bundle (Google Play Store)
        run: |
          flutter build appbundle --release --build-number=${{ steps.build_info.outputs.build_number }}

      - name: Build Split APKs (Direct Distribution)
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ steps.build_info.outputs.build_number }}

      - name: Build Universal APK
        run: |
          flutter build apk --release --build-number=${{ steps.build_info.outputs.build_number }}

      - name: Upload Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: afri_bms-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: afri_bms-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
