name: Afri_BMS Multi-Platform CI - Android & iOS

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      run_android:
        description: 'Build & verify Android platform (APK & AAB)'
        required: true
        type: boolean
        default: true
      run_ios:
        description: 'Build & verify iOS platform (No-Codesign)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1: CODE QUALITY, ANALYSIS, TEST SUITE & CODE COVERAGE
  # ─────────────────────────────────────────────────────────────────────────────
  quality_gate:
    name: Code Quality, Analysis & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static code analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run unit & widget test suite with coverage
        run: flutter test --coverage

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2: ANDROID BUILDS (Debug APK, Release APK, Release AppBundle)
  # ─────────────────────────────────────────────────────────────────────────────
  build_android:
    name: Build Android (APK & AAB)
    needs: [quality_gate]
    if: github.event_name != 'workflow_dispatch' || inputs.run_android == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle Caches & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK (Fallback Signing)
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-artifacts
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Android AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-artifact
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3: IOS BUILD (CocoaPods & No-Codesign Verification)
  # ─────────────────────────────────────────────────────────────────────────────
  build_ios:
    name: Build iOS (No-Codesign Verification)
    needs: [quality_gate]
    if: github.event_name != 'workflow_dispatch' || inputs.run_ios == true
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/.pub-cache
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify CocoaPods Version
        run: pod --version

      - name: Build iOS Application (Debug, No Code Signing)
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS Build Payload
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-payload
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4: SUMMARY & STATUS ENFORCEMENT
  # ─────────────────────────────────────────────────────────────────────────────
  ci_summary:
    name: Multi-Platform CI Summary
    needs: [quality_gate, build_android, build_ios]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary Report
        run: |
          echo "## 📊 Afri_BMS Multi-Platform CI Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target / Job | Runner OS | Status | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality Gate (Format, Analyze, Tests & Coverage)** | Ubuntu Latest | ${{ needs.quality_gate.result == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ needs.quality_gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android (Debug APK, Release APK & AAB)** | Ubuntu Latest | ${{ needs.build_android.result == 'success' && '✅ Passed' || (needs.build_android.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | ${{ needs.build_android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **iOS (No-Codesign Verification)** | macOS Latest | ${{ needs.build_ios.result == 'success' && '✅ Passed' || (needs.build_ios.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | ${{ needs.build_ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Enforce Pipeline Success
        run: |
          if [ "${{ needs.quality_gate.result }}" != "success" ]; then
            echo "❌ Quality Gate failed! Review test or lint errors."
            exit 1
          fi
          if [ "${{ needs.build_android.result }}" == "failure" ]; then
            echo "❌ Android build failed!"
            exit 1
          fi
          if [ "${{ needs.build_ios.result }}" == "failure" ]; then
            echo "❌ iOS build failed!"
            exit 1
          fi
          echo "✅ All required CI stages passed successfully!"
